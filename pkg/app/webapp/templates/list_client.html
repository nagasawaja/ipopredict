{{define "list_client_body"}}
<div class="row" style="justify-content: space-between; margin-bottom: 6px; flex-wrap: wrap; gap: 6px;">
  <span class="muted">股票列表 共 <span id="total-count">0</span> 条</span>
  <form id="list-form" class="row" style="margin: 0; flex-wrap: wrap; gap: 6px; align-items: center;">
    <input type="text" name="q" placeholder="代码/名称" style="width: 100px;"/>
    <label class="muted" style="font-size: 12px;">中介</label>
    <select name="role" id="role-select" style="padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px;">
      <option value="">全部</option>
      <option value="sponsor">sponsor（保薦人）</option>
      <option value="underwriter">underwriter（包銷商）</option>
      <option value="bookrunner">bookrunner（賬簿管理人）</option>
      <option value="global_coordinator">global_coordinator（全球協調人）</option>
    </select>
    <select name="intermediary" id="intermediary-select" style="padding: 4px 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 12px; min-width: 120px; display: none;">
      <option value="">— 选公司 —</option>
    </select>
    <input type="text" name="intermediary" id="intermediary-input" placeholder="机构名称" style="width: 100px;"/>
    <input type="hidden" name="orderBy" id="orderBy" value=""/>
    <input type="hidden" name="order" id="order" value="asc"/>
    <input type="hidden" name="page" id="page-input" value="1"/>
    <button type="submit">查询</button>
  </form>
</div>

<div style="overflow-x: auto;">
<table class="table" style="table-layout: fixed;">
  <thead>
    <tr>
      <th>代码</th>
      <th class="wrap name-col">名称</th>
      <th>发行价</th>
      <th class="num">一手</th>
      <th class="num">入场费</th>
      <th class="num">募资</th>
      <th class="num">市值</th>
      <th class="num">公开募集股数</th>
      <th class="mechanism-col">机制</th>
      <th class="num">PE</th>
      <th class="num">申请人数</th>
      <th class="num"><a href="#" id="sort-one-lot" style="color: inherit;">中签率</a></th>
      <th class="num">认购倍数</th>
      <th class="num">首日</th>
      <th>暗盘时间</th>
      <th class="num">辉立暗</th>
      <th class="num">富途暗</th>
      <th>招股书</th>
      <th>预测</th>
    </tr>
  </thead>
  <tbody id="list-tbody"></tbody>
</table>
</div>

<div class="pager" id="pager"></div>

<script>
(function(){
  var intermediaries = null;

  function fmt(v) { return v != null && v !== '' ? v : '-'; }
  function fmtNum(v, d) {
    if (v == null) return '-';
    var n = Number(v);
    if (isNaN(n)) return '-';
    if (d === 0) return String(Math.round(n));
    return d ? n.toFixed(d) : String(n);
  }
  function fmtPct(v) {
    if (v == null) return '-';
    var n = Number(v);
    if (isNaN(n)) return '-';
    return n.toFixed(2) + '%';
  }
  function fmtPctColored(v) {
    if (v == null) return '-';
    var n = Number(v);
    if (isNaN(n)) return '-';
    var txt = n.toFixed(2) + '%';
    if (n > 0) return '<span class="pct-up">' + txt + '</span>';
    if (n < 0) return '<span class="pct-down">' + txt + '</span>';
    return txt;
  }
  function fmtHkd(v) {
    if (v == null || isNaN(Number(v))) return '-';
    var n = Number(v);
    return (n / 1e8).toFixed(2) + '亿';
  }
  function fmtRaise(v, text) {
    if (text && String(text).trim()) {
      var t = String(text).trim();
      var m = t.match(/-?\d+(?:\.\d+)?/);
      if (m) {
        var num = Number(m[0]);
        if (!isNaN(num)) {
          if (/[万萬]/.test(t)) return (num / 10000).toFixed(2) + '亿';
          return num.toFixed(2) + '亿';
        }
      }
    }
    if (v == null || isNaN(Number(v))) return '-';
    var n = Number(v);
    return (n / 1e8).toFixed(2) + '亿';
  }
  function fmtShares(v) {
    if (v == null || isNaN(Number(v))) return '-';
    var n = Number(v);
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(2) + '万';
    return String(Math.round(n));
  }
  function allocationLabel(v) {
    v = String(v || '').trim().toLowerCase();
    if (v === 'mechanism_b') return 'B';
    if (v === 'mechanism_b_likely') return 'B?';
    if (v === 'mechanism_a') return 'A';
    if (v === 'mechanism_a_or_18c_likely') return 'A/18C?';
    if (v === 'chapter_18c') return '18C';
    if (v === 'chapter_18c_pre_commercial') return '18C-P';
    if (v === 'unknown_biotech_marker') return 'Bio?';
    if (!v || v === 'unknown') return '-';
    return v;
  }

  function buildParams(extra) {
    var form = document.getElementById('list-form');
    var fd = new FormData(form);
    var p = {};
    fd.forEach(function(v, k) { if (v) p[k] = v; });
    if (extra) for (var k in extra) p[k] = extra[k];
    return p;
  }
  function renderRow(r) {
    var priceLow = r.offer_price_low != null ? fmtNum(r.offer_price_low, 2) : '-';
    var priceHigh = r.offer_price_high != null ? fmtNum(r.offer_price_high, 2) : '-';
    var price = r.offer_price != null ? ' (' + fmtNum(r.offer_price, 2) + ')' : '';
    var raise = fmtRaise(r.amount_hkd, r.amount_text);
    var marketCap = fmtHkd(r.market_cap_hkd);
    var pdf = r.prospectus_url ? '<a href="'+r.prospectus_url+'" target="_blank" rel="noreferrer">PDF</a>' : '-';
    var allocationTitle = [r.allocation_mechanism, r.allocation_mechanism_evidence].filter(Boolean).join(' · ');
    var allocation = r.allocation_mechanism ? '<span title="'+fmt(allocationTitle)+'">'+allocationLabel(r.allocation_mechanism)+'</span>' : '-';
    var greyDate = r.grey_date || '-';
    return '<tr>' +
      '<td class="code"><a href="/stocks/'+r.stock_code+'">'+r.stock_code+'</a></td>' +
      '<td class="wrap name-col">'+fmt(r.stock_name)+'</td>' +
      '<td class="num">'+priceLow+'~'+priceHigh+price+'</td>' +
      '<td class="num">'+fmtNum(r.lot_size, 0)+'</td>' +
      '<td class="num">'+fmtNum(r.admission_fee_hkd, 0)+'</td>' +
      '<td class="num">'+raise+'</td>' +
      '<td class="num">'+marketCap+'</td>' +
      '<td class="num">'+fmtShares(r.public_offer_shares)+'</td>' +
      '<td class="code mechanism-col">'+allocation+'</td>' +
      '<td class="num">'+fmtNum(r.pe, 2)+'</td>' +
      '<td class="num">'+fmtNum(r.applicants, 0)+'</td>' +
      '<td class="num">'+fmtPct(r.one_lot_win_rate_pct)+'</td>' +
      '<td class="num">'+fmtNum(r.subscription_multiple, 2)+'</td>' +
      '<td class="num">'+fmtPctColored(r.first_day_incr_rate_pct)+'</td>' +
      '<td>'+fmt(greyDate)+'</td>' +
      '<td class="num">'+fmtPctColored(r.grey_incr_rate_pct)+'</td>' +
      '<td class="num">'+fmtPctColored(r.grey_incr_rate_pct2)+'</td>' +
      '<td>'+pdf+'</td>' +
      '<td><a href="/predict/'+r.stock_code+'" class="btnlink">预测</a></td>' +
    '</tr>';
  }

  function bodyForStocks(p) {
    p = p || buildParams();
    var body = {
      q: p.q || '',
      role: p.role || '',
      intermediary: p.intermediary || '',
      page: parseInt(p.page, 10) || 1,
      pageSize: 100,
      orderBy: p.orderBy || '',
      order: p.order || 'asc'
    };
    return body;
  }

  function loadStocks(params) {
    var body = bodyForStocks(params || buildParams());
    fetch('/api/stocks', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    }).then(function(res){ return res.json(); }).then(function(data){
      document.getElementById('total-count').textContent = data.total;
      var tbody = document.getElementById('list-tbody');
      tbody.innerHTML = (data.rows || []).map(renderRow).join('');
      var page = data.page || 1;
      var pageSize = data.pageSize || 100;
      var total = data.total || 0;
      var totalPages = Math.max(1, Math.ceil(total / pageSize));
      document.getElementById('page-input').value = String(page);
      var pager = document.getElementById('pager');
      pager.innerHTML = '<span>第 '+page+' 页 · 每页 '+pageSize+'</span><span>' +
        (page > 1 ? '<a class="btnlink" href="#" id="pager-prev">上一页</a> ' : '') +
        (page < totalPages ? '<a class="btnlink" href="#" id="pager-next">下一页</a>' : '') + '</span>';
      if (page > 1) {
        document.getElementById('pager-prev').addEventListener('click', function(e){
          e.preventDefault();
          document.getElementById('page-input').value = String(page - 1);
          loadStocks(buildParams());
        });
      }
      if (page < totalPages) {
        document.getElementById('pager-next').addEventListener('click', function(e){
          e.preventDefault();
          document.getElementById('page-input').value = String(page + 1);
          loadStocks(buildParams());
        });
      }
    }).catch(function(err){ document.getElementById('total-count').textContent = '0'; document.getElementById('list-tbody').innerHTML = '<tr><td colspan="19">加载失败</td></tr>'; });
  }

  function loadIntermediaries() {
    fetch('/api/intermediaries', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: '{}'
    }).then(function(res){ return res.json(); }).then(function(data){
      intermediaries = {
        sponsor: data.sponsor || [],
        underwriter: data.underwriter || [],
        bookrunner: data.bookrunner || [],
        global_coordinator: data.global_coordinator || []
      };
      loadStocks(buildParams());
    }).catch(function(){ intermediaries = {}; loadStocks(buildParams()); });
  }

  document.getElementById('role-select').addEventListener('change', function(){
    var role = this.value;
    var sel = document.getElementById('intermediary-select');
    var inp = document.getElementById('intermediary-input');
    if (role && intermediaries && intermediaries[role] && intermediaries[role].length) {
      sel.style.display = '';
      inp.style.display = 'none';
      inp.removeAttribute('name');
      sel.setAttribute('name','intermediary');
      sel.innerHTML = '<option value="">— 选公司 —</option>' + intermediaries[role].map(function(n){ return '<option value="'+n+'">'+n+'</option>'; }).join('');
    } else {
      sel.style.display = 'none';
      sel.removeAttribute('name');
      inp.style.display = '';
      inp.setAttribute('name','intermediary');
      inp.value = '';
    }
  });
  document.getElementById('list-form').addEventListener('submit', function(e){
    e.preventDefault();
    document.getElementById('page-input').value = '1';
    loadStocks(buildParams());
  });

  document.getElementById('sort-one-lot').addEventListener('click', function(e){
    e.preventDefault();
    var cur = document.getElementById('order').value;
    var next = cur === 'asc' ? 'desc' : 'asc';
    document.getElementById('orderBy').value = 'one_lot_win_rate_pct';
    document.getElementById('order').value = next;
    document.getElementById('page-input').value = '1';
    loadStocks(buildParams());
  });

  loadIntermediaries();
})();
</script>
{{end}}

{{define "list_client.html"}}
{{template "layout_head" .}}
{{template "list_client_body" .}}
{{template "layout_foot" .}}
{{end}}
